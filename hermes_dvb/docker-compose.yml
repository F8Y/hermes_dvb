# ======================================================================
#  hermes_dvb — стек (собирать на сервере: amd64)
#    postgres         — хранилище собранного (raw_items, sources)
#    tiktok-collector — скрап TikTok (read-only)
#    max-collector    — userbot MAX, отдельный аккаунт, read-only
#    hermes           — агент: читает БД (read-only), классифицирует на лету,
#                       дайджесты в Telegram, поиск источников
#  Классификация теперь на Hermes (отдельный analyzer убран). Hermes ходит
#  в БД только через read-only роль hermes_ro — ни DROP, ни записи.
#
#  Лимиты ресурсов и логов заданы под общий тестовый сервер.
#  Память/данные durable: ./pgdata и ./hermes_data — bind-mount на хосте,
#  переживают prune и реап контейнеров.
#
#  Запуск БД:        docker compose up -d --build postgres
#  Запуск всего:     docker compose up -d --build
#  Логи:             docker compose logs -f <service>
# ======================================================================

name: hermes_dvb

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Только loopback хоста — снаружи невидимо. Нужно, чтобы host-сетевой
    # Hermes (через Postgres-MCP) дотянулся до базы по 127.0.0.1.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    cpus: 0.5
    mem_limit: 512m
    logging: *default-logging

  # Агент. Память/конфиг/скиллы — в ./hermes_data (bind-mount, durable).
  # Секреты Hermes (ключ модели, токен Telegram) задаются мастером setup
  # в ./hermes_data, НЕ через наш .env. Перед up нужно один раз прогнать setup.
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes_dvb_agent
    restart: unless-stopped
    command: gateway run
    # Сеть хоста: трафик к Telegram идёт хостовым путём (OUTPUT), который
    # достаёт api.telegram.org, в отличие от FORWARD-пути контейнеров.
    network_mode: host
    volumes:
      - ./hermes_data:/opt/data # ВАЖНО: ровно /opt/data, иначе 0 скиллов
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 1024m
    logging: *default-logging

# Сервер: 4 vCPU / 7.4 ГБ (≈3.8 ГБ уже заняты другими).
# Потолки (4 сервиса): CPU 0.5+0.5+0.25+0.5 = 1.75 (~44%),
# RAM 512+1024+256+1024 = 2816 МБ (~38%). Это ПОТОЛКИ, не резерв:
# коллекторы бьют вспышками, hermes почти всё время простаивает.
