# ======================================================================
#  hermes_dvb — стек (собирать на сервере: amd64)
#    postgres         — хранилище (raw + findings)
#    tiktok-collector — скрап TikTok (read-only)
#    max-collector    — userbot MAX, отдельный аккаунт, read-only
#    analyzer         — массовая классификация (дешёвая модель Cloud.ru)
#    hermes           — агент: gateway/Telegram, поиск, скиллы (средняя модель)
#
#  Лимиты ресурсов и логов заданы под общий тестовый сервер.
#  Память/данные durable: ./pgdata и ./hermes_data — bind-mount на хосте,
#  переживают prune и реап контейнеров.
#
#  Запуск БД:        docker compose up -d --build postgres
#  Запуск всего:     docker compose up -d --build
#  Логи:             docker compose logs -f <service>
# ======================================================================

name: hermes_dvb

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    cpus: 0.5
    mem_limit: 512m
    logging: *default-logging

  tiktok-collector:
    build:
      context: .
      dockerfile: collectors/tiktok/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 1024m # Chromium прожорлив, но скрапит вспышками и спит между ними
    logging: *default-logging

  max-collector:
    build:
      context: .
      dockerfile: collectors/max/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 0.25
    mem_limit: 256m
    logging: *default-logging

  analyzer:
    build:
      context: .
      dockerfile: analyzer/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 0.25
    mem_limit: 384m
    logging: *default-logging

  # Агент. Память/конфиг/скиллы — в ./hermes_data (bind-mount, durable).
  # Секреты Hermes (ключ модели, токен Telegram) задаются мастером setup
  # в ./hermes_data, НЕ через наш .env. Перед up нужно один раз прогнать setup.
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes_dvb_agent
    restart: unless-stopped
    command: gateway run
    # Сеть хоста: трафик к Telegram идёт хостовым путём (OUTPUT), который
    # достаёт api.telegram.org, в отличие от FORWARD-пути контейнеров.
    network_mode: host
    volumes:
      - ./hermes_data:/opt/data # ВАЖНО: ровно /opt/data, иначе 0 скиллов
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 1024m
    logging: *default-logging

# = 3200 МБ (~43%). Это ПОТОЛКИ, не резерв: коллекторы бьют вспышками, hermes
# почти всё время простаивает, так что реальное потребление заметно ниже.
